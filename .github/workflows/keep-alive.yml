name: Keep Streamlit App Awake

# Streamlit Community Cloud puts apps to sleep after ~12h of inactivity.
# A real browser session (WebSocket) is needed to reset the inactivity timer —
# a plain curl/HTTP request does NOT count as activity.

on:
  schedule:
    # Every 6 hours, on the hour (UTC). Cron in Actions is always UTC.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# Never let two keep-alive runs overlap.
concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: "https://esg-mmbouh.streamlit.app/"
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Wake the app with a real browser session
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              print(f"Opening {url}")
              page.goto(url, wait_until="networkidle", timeout=60_000)

              # If the app is asleep, Streamlit shows a "Yes, get this app back up!" button.
              # The label has varied over versions, so match a few known variants.
              wake_selectors = [
                  "button:has-text('get this app back up')",
                  "button:has-text('Yes, get this app back up')",
                  "text=get this app back up",
              ]
              clicked = False
              for sel in wake_selectors:
                  try:
                      btn = page.locator(sel).first
                      if btn.count() > 0 and btn.is_visible():
                          print(f"App was asleep — clicking wake button via: {sel}")
                          btn.click()
                          clicked = True
                          break
                  except Exception as e:
                      print(f"Selector {sel!r} not actionable: {e}")

              if not clicked:
                  print("No wake button found — app was already awake.")

              # Give Streamlit time to establish the WebSocket session and register
              # real activity so the inactivity timer resets.
              page.wait_for_timeout(20_000)

              print(f"Page title: {page.title()}")
              browser.close()
              print("Keep-alive ping complete.")
          PY
